<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · Mucize Kodlarım</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Sora:wght@300;400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#3a1a38 0,#0b0714 55%);color:#f4efe6;font:300 16px/1.6 Sora,system-ui,sans-serif;text-align:center;padding:24px}
code{font:400 13px "JetBrains Mono",monospace;color:#a9c98a}
h1{font:500 clamp(44px,8vw,86px)/1 "Cormorant Garamond",serif;margin:18px 0}
em{font-style:italic;background:linear-gradient(120deg,#e08cc4,#f3d9a4,#a9c98a);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#b9adc6;max-width:460px;margin:0 auto 28px}
a{display:inline-block;padding:14px 22px;border-radius:999px;background:linear-gradient(120deg,#e08cc4,#f3d9a4,#a9c98a);color:#1a0f22;text-decoration:none;font-weight:500;margin:4px}
a.g{background:none;border:1px solid rgba(255,255,255,.15);color:#f4efe6}
</style></head>
<body><div>
<code>// hata 404 · kod bulunamadı</code>
<h1>Bu sayfa <em>güncellendi.</em></h1>
<p>Aradığın sayfa yeni sitemizde yok ya da adresi değişti. Ana sayfadan devam edebilirsin.</p>
<a id="ev" href="/">Ana sayfaya dön →</a><a id="eg" class="g" href="/seminerler/">Eğitimler</a>
</div>
<script>
/* GitHub'ın test adresinde (…github.io/web-sitesi/) kök klasör farklıdır */
var k = location.hostname.endsWith('github.io') ? '/' + location.pathname.split('/')[1] + '/' : '/';
document.getElementById('ev').href = k; document.getElementById('eg').href = k + 'seminerler/';
</script>
</body></html>
